<div class="world-chat-box">
  <header class="module-header">
    <h6>World Chat</h6>
  </header>
  <div class="module-content mctf-row-container">
    <div class="chat-box row-fluid">
      <ul class="chat-list" data-chat-list>
        <li data-chat-placeholder>Loading chat...</li>
      </ul>
    </div>
    <div class="row-fixed">
      <form class="chat-input" data-chat-form>
        <div class="chat-input-shell">
          <div class="input-container"><input type="text" placeholder="Type to chat" autocomplete="off" data-chat-input /></div>
          <span class="mctf-numbers" data-chat-counter></span>
        </div>
        <button class="mctf-cta cta--light-blue" type="submit">Send</button>
      </form>
    </div>
  </div>
</div>

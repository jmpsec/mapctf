<header class="module-header">
    <h6>Filter</h6>
</header>
<div class="module-content">
    <div class="mctf-section-border">
        <div class="module-top">
            <div class="radio-tabs">
                <input type="radio" name="mctf--module--filter" id="mctf--module--filter--category" value="category" checked="">
                <label for="mctf--module--filter--category" class="click-effect"><span>Category</span></label>
                
                <input type="radio" name="mctf--module--filter" id="mctf--module--filter--point-value" value="point-value">
                <label for="mctf--module--filter--point-value" class="click-effect"><span>Point Value</span></label>
            </div>
        </div>
        <div class="module-scrollable">
            <div class="tab-content-container">
                <ul class="radio-list radio-tab-content active" data-tab="category" data-filter-options="category"></ul>
                <ul class="radio-list radio-tab-content" data-tab="point-value" data-filter-options="point-value"></ul>
            </div>
        </div>
    </div>
</div>

<header class="module-header">
    <h6>Activity</h6>
</header>
<div class="module-content">
    <div class="mctf-section-border">
        <div class="module-top">
            <div class="radio-tabs">
                <input type="radio" name="mctf--module--activity" id="mctf--module--activity--your-team" value="your-team">
                <label for="mctf--module--activity--your-team" class="click-effect"><span>Your Team</span></label>
                
                <input type="radio" name="mctf--module--activity" id="mctf--module--activity--everyone" checked="" value="all">
                <label for="mctf--module--activity--everyone" class="click-effect"><span>Everyone</span></label>
            </div>
        </div>
        <div class="module-scrollable">
            <ul class="activity-stream"></ul>
        </div>
    </div>
</div>

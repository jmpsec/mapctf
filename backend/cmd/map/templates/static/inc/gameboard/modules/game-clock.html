<header class="module-header">
    <h6>Game Clock</h6>
</header>
<div class="module-content module-scrollable">
    
    <div class="game-clock mctf-numbers">
        <span class="clock-days is-empty">--</span>:<span class="clock-hours is-empty">--</span>:<span class="clock-minutes is-empty">--</span>:<span class="clock-seconds is-empty">--</span>:<span class="clock-milliseconds three-digit is-empty">---</span>
    </div>

    <div class="game-progress mctf-progress-bar">
        <span class="label label--left">[Start]</span>
        <span class="label label--right">[End]</span>

        <div class="indicator game-progress-indicator">
            <span class="indicator-cell"></span>
            <span class="indicator-cell"></span>
            <span class="indicator-cell"></span>
            <span class="indicator-cell"></span>
            <span class="indicator-cell"></span>
            <span class="indicator-cell"></span>
            <span class="indicator-cell"></span>
            <span class="indicator-cell"></span>
            <span class="indicator-cell"></span>
            <span class="indicator-cell"></span>
        </div>
    </div>
</div>

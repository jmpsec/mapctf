<div class="mctf-modal-content admin-activity-modal">
  <div class="modal-title">
    <h4>
      <span class="modal-kicker" data-i18n="admin.activity.kicker">Admin Activity Log</span>
      <span class="highlighted" data-i18n="admin.activity.add_entry">Add Entry</span>
    </h4>
    <a href="#" class="js-close-modal">
      <svg class="icon icon--close"><use xlink:href="#icon--close" /></svg>
    </a>
  </div>

  <form id="admin-add-activity-form" class="mctf-form">
    <fieldset class="form-set">
      <div class="admin-activity-form-grid">
        <div class="form-el">
          <label for="admin-add-activity-subject">
            <span data-i18n="admin.activity.subject">Subject</span>
          </label>
          <input id="admin-add-activity-subject" name="subject" type="text" data-i18n-placeholder="admin.activity.subject_ph" placeholder="Blue Team or Admin" />
        </div>

        <div class="form-el">
          <label for="admin-add-activity-action">
            <span data-i18n="admin.activity.action">Action</span>
          </label>
          <select id="admin-add-activity-action" name="action">
            <option value="announcement" selected data-i18n="admin.activity.action_announcement">Announcement</option>
            <option value="completed" data-i18n="admin.activity.action_completed">Completed</option>
            <option value="enabled" data-i18n="admin.activity.action_enabled">Enabled</option>
            <option value="disabled" data-i18n="admin.activity.action_disabled">Disabled</option>
          </select>
        </div>

        <div class="form-el">
          <label for="admin-add-activity-visible">
            <span data-i18n="admin.activity.visible">Visible</span>
          </label>
          <select id="admin-add-activity-visible" name="visible">
            <option value="true" selected data-i18n="admin.activity.visible_opt">Visible</option>
            <option value="false" data-i18n="admin.activity.hidden_opt">Hidden</option>
          </select>
        </div>

        <div class="form-el form-el--full">
          <label for="admin-add-activity-message">
            <span data-i18n="admin.activity.message">Message</span>
          </label>
          <input id="admin-add-activity-message" name="message" type="text" data-i18n-placeholder="admin.activity.message_ph" placeholder="Captured Spain" />
        </div>

      </div>

      <div class="admin-activity-modal-example">
        <span data-i18n="admin.activity.example">Example</span>
        <code>subject=Admin action=announcement message=Scoring will resume in 5 minutes</code>
      </div>
    </fieldset>

    <div class="form-el--multiple-actions mctf-column-container admin-activity-modal-actions">
      <div class="col col-1-2">
        <a href="#" class="mctf-cta js-close-modal" data-i18n="admin.modal.cancel">Cancel</a>
      </div>
      <div class="col col-1-2 actions--right">
        <button class="mctf-cta cta--yellow" type="submit" data-i18n="admin.modal.create_entry">Create Entry</button>
      </div>
    </div>
  </form>
</div>

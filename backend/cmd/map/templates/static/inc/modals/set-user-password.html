<div class="mctf-modal-content">
  <header class="modal-title">
    <h4>
      <span data-i18n="modal.admin_kicker">admin_</span>
      <span class="highlighted" data-i18n="admin.modal.set_password">Set Password</span>
    </h4>
    <a href="#" class="js-close-modal">
      <svg class="icon icon--close"><use xlink:href="#icon--close" /></svg>
    </a>
  </header>

  <div class="action-main">
    <form id="admin-set-user-password-form" class="validate-form">
      <p class="admin-modal-note"><span data-i18n="admin.modal.set_password_note">Set a new password for</span> <span class="highlighted js-set-user-password-username" data-i18n="admin.modal.set_password_user">this user</span>.</p>
      <div class="form-el el--block-label el--full-text">
        <label for="admin-set-user-password-new" data-i18n="admin.modal.new_password">New Password</label>
        <input id="admin-set-user-password-new" name="new_password" type="password" autocomplete="new-password" required />
      </div>

      <div class="action-actionable">
        <a href="#" class="mctf-cta cta--red js-close-modal" data-i18n="admin.modal.cancel">Cancel</a>
        <button class="mctf-cta cta--yellow js-set-user-password" type="submit" data-i18n="admin.modal.set_password">Set Password</button>
      </div>
    </form>
  </div>
</div>

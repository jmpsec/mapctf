<div class="mctf-modal-content">
  <header class="modal-title">
    <h4>
      admin_
      <span class="highlighted">Set Password</span>
    </h4>
    <a href="#" class="js-close-modal">
      <svg class="icon icon--close"><use xlink:href="#icon--close" /></svg>
    </a>
  </header>

  <div class="action-main">
    <form id="admin-set-user-password-form" class="validate-form">
      <p class="admin-modal-note">Set a new password for <span class="highlighted js-set-user-password-username">this user</span>.</p>
      <div class="form-el el--block-label el--full-text">
        <label for="admin-set-user-password-new">New Password</label>
        <input id="admin-set-user-password-new" name="new_password" type="password" autocomplete="new-password" required />
      </div>

      <div class="action-actionable">
        <a href="#" class="mctf-cta cta--red js-close-modal">Cancel</a>
        <button class="mctf-cta cta--yellow js-set-user-password" type="submit">Set Password</button>
      </div>
    </form>
  </div>
</div>

<div class="mctf-modal-content">
  <header class="modal-title">
    <h4><span data-i18n="modal.status_kicker">status_</span><span class="highlighted" data-i18n="admin.modal.disable_all_users">Disable All Users</span></h4>
    <a href="#" class="js-close-modal"><svg class="icon icon--close"><use xlink:href="#icon--close"/></svg></a>
  </header>

  <div class="action-main">
    <p data-i18n="admin.modal.confirm_disable_all_users">Are you sure you want to disable all users?</p>

    <div class="action-actionable">
      <a href="#" class="mctf-cta cta--red js-close-modal" data-i18n="admin.modal.no">No</a>
      <a href="#" class="mctf-cta cta--yellow js-confirm-disable-all-users" data-i18n="admin.modal.yes">Yes</a>
    </div>
  </div>
</div>

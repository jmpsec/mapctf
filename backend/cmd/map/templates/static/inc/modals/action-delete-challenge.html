    <a href="#" class="js-close-modal"><svg class="icon icon--close"><use xlink:href="#icon--close"/></svg></a>

  <div class="action-main">

      <a href="#" class="mctf-cta cta--yellow js-confirm-delete-challenge" data-i18n="admin.modal.yes">Yes</a>

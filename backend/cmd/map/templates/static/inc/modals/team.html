<div class="mctf-modal-content">
  <div class="modal-title">
    <h4>
      <span class="team-name highlighted"></span>
    </h4>
    <a href="#" class="js-close-modal">
      <svg class="icon icon--close"><use xlink:href="#icon--close" /></svg>
    </a>
  </div>

  <div class="mctf-modal-main team-modal-main">
    <div class="team-modal-card">
      <div class="team-modal-top">
        <svg class="icon--badge"><use xlink:href=""></use></svg>
        <div class="team-points-panel">
          <span class="points-number mctf-numbers team-points-value"></span>
          <span class="points-label" data-i18n="gb.points">Points</span>
        </div>
      </div>

      <div class="team-last-score-panel">
        <header><span class="highlighted" data-i18n="modal.last_score_label">last_score</span></header>
        <div class="last-score"></div>
      </div>

      <div class="team-members-section">
        <header><span class="highlighted" data-i18n="modal.team_members_label">team_members</span></header>
        <ul class="team-members"></ul>
      </div>
    </div>
  </div>
</div>

<div class="mctf-modal-content">
  <header class="modal-title">
    <h4>
      <span data-i18n="modal.admin_kicker">admin_</span>
      <span class="highlighted" data-i18n="admin.users.add">Add User</span>
    </h4>
    <a href="#" class="js-close-modal">
      <svg class="icon icon--close"><use xlink:href="#icon--close" /></svg>
    </a>
  </header>

  <div class="action-main">
    <form id="admin-add-user-form" class="validate-form">
      <div class="form-el el--block-label el--full-text">
        <label for="admin-add-user-username" data-i18n="admin.users.username">Username</label>
        <input id="admin-add-user-username" name="username" type="text" style="width: 100%" required />
      </div>
      <div class="form-el el--block-label el--full-text">
        <label for="admin-add-user-password" data-i18n="login.password_label">Password</label>
        <input id="admin-add-user-password" name="password" type="password" required />
      </div>
      <div class="form-el el--block-label el--full-text">
        <label for="admin-add-user-name" data-i18n="admin.users.name">Name</label>
        <input id="admin-add-user-name" name="name" type="text" style="width: 100%" />
      </div>
      <div class="form-el el--block-label el--full-text">
        <label for="admin-add-user-email" data-i18n="admin.users.email">Email</label>
        <input id="admin-add-user-email" name="email" type="email" style="width: 100%" />
      </div>
      <div class="form-el el--block-label el--full-text">
        <label for="admin-add-user-team-id" data-i18n="admin.users.team">Team</label>
        <select id="admin-add-user-team-id" name="team_id">
          <option value="0" data-i18n="admin.none">None</option>
        </select>
      </div>

      <div class="action-actionable">
        <a href="#" class="mctf-cta cta--red js-close-modal" data-i18n="admin.modal.cancel">Cancel</a>
        <button class="mctf-cta cta--yellow js-create-user" type="submit" data-i18n="admin.modal.create_user">Create User</button>
      </div>
    </form>
  </div>
</div>
